apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  env: dev
          - git:
              repoURL: https://github.com/mtweeman/argo-cd-test.git
              revision: HEAD
              directories:
                - path: apps/*
  template:
    metadata:
      name: '{{index .path.segments 1}}'
    spec:
      project: default
      sources:
        - repoURL: https://github.com/mtweeman/argo-cd-test.git
          path: '{{.path.path}}'
          targetRevision: HEAD
          helm:
            valueFiles:
              - $values/values/envs/{{index .metadata.labels "env"}}-values.yaml
        - repoURL: https://github.com/mtweeman/argo-cd-test.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          selfHeal: true
          prune: true